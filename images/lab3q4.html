<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nice Form</title>
</head>
<body>
    <form>
        <h1><b>This is a nice form</b></h1>

        <p>choose your color</p>
        <ul>
            <li>
                <label>
                    <input type="radio" name="color" value="red">
                    red
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="color" value="blue">
                    blue
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="color" value="green">
                    green
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="color" value="yellow">
                    yellow
                </label>
            </li>
        </ul>

        <p>choose your food</p>
        <ol>
            <li>
                <label>
                    <input type="radio" name="food" value="apple">
                    apple
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="food" value="pear">
                    pear
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="food" value="orange">
                    orange
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="food" value="banana">
                    banana
                </label>
            </li>
        </ol>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
